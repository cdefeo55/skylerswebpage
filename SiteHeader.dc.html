<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style data-mobile-header-polish>
  .site-brand-row { display: flex; align-items: center; gap: 13px; text-decoration: none; color: inherit; }
  .site-brand-text { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-width: 0; }
  .site-brand-name { display: block; text-decoration: none; }
  .site-broker-link { display: block; text-decoration: none; }
  .site-menu a { display: inline-flex; align-items: center; justify-content: center; }

  @media (max-width: 980px) {
    .site-nav { justify-content: center !important; }
    .site-brand { width: 100% !important; justify-content: center !important; }
    .site-brand-text { align-items: center !important; text-align: center !important; }
    .site-menu { width: 100% !important; justify-content: center !important; gap: 18px !important; }
  }

  @media (max-width: 760px) {
    .site-header { position: sticky !important; top: 0 !important; }
    .site-nav {
      width: min(100% - 28px, 1240px) !important;
      min-height: auto !important;
      padding: 16px 0 16px !important;
      gap: 14px !important;
      align-items: center !important;
      justify-content: center !important;
      flex-direction: column !important;
    }
    .site-brand {
      width: 100% !important;
      justify-content: center !important;
      align-items: center !important;
      padding-top: 4px !important;
    }
    .site-brand-row { justify-content: center !important; gap: 10px !important; }
    .site-brand-row img { width: 38px !important; }
    .site-brand-name {
      font-size: 0.98rem !important;
      letter-spacing: 0.13em !important;
      line-height: 1.1 !important;
      text-align: center !important;
    }
    .site-broker-link {
      font-size: 0.52rem !important;
      letter-spacing: 0.17em !important;
      line-height: 1.35 !important;
      text-align: center !important;
      max-width: 280px !important;
    }
    .site-menu {
      width: 100% !important;
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
      align-items: stretch !important;
      justify-content: stretch !important;
    }
    .site-menu a {
      width: 100% !important;
      min-height: 38px !important;
      padding: 10px 8px !important;
      border: 1px solid rgba(23,49,41,0.13) !important;
      border-radius: 2px !important;
      background: rgba(255,253,248,0.34) !important;
      font-size: 0.64rem !important;
      letter-spacing: 0.075em !important;
      line-height: 1 !important;
      white-space: nowrap !important;
      text-align: center !important;
    }
    .site-menu a.site-menu-cta {
      grid-column: 1 / -1 !important;
      background: #173129 !important;
      color: #f4ede1 !important;
      border-color: #173129 !important;
      padding: 11px 12px !important;
      min-height: 40px !important;
    }
  }

  @media (max-width: 390px) {
    .site-nav { width: min(100% - 22px, 1240px) !important; padding-top: 14px !important; }
    .site-brand-row img { width: 34px !important; }
    .site-brand-name { font-size: 0.88rem !important; letter-spacing: 0.105em !important; }
    .site-broker-link { font-size: 0.48rem !important; letter-spacing: 0.14em !important; }
    .site-menu a { font-size: 0.58rem !important; letter-spacing: 0.055em !important; padding-left: 6px !important; padding-right: 6px !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<header class="site-header" style="position: sticky; top: 0; z-index: 50; background: rgba(244,237,225,0.9); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(23,49,41,0.12); font-family: 'Mulish', system-ui, sans-serif;">
    <nav class="site-nav" style="width: min(1240px, calc(100% - 48px)); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; min-height: 84px;">
      <div class="site-brand" style="display: flex; align-items: center; gap: 13px; color: inherit;">
        <a class="site-brand-row" href="index.html" style="display: flex; align-items: center; gap: 13px; text-decoration: none; color: inherit;">
          <img src="logo-mark.png" alt="Skyler Davis Group" style="width: 46px; height: auto; display: block;">
          <span class="site-brand-text" style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start;">
            <span class="site-brand-name" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.12rem; font-weight: 600; letter-spacing: 0.19em; text-transform: uppercase; color: #173129; line-height: 1;">Skyler Davis Group</span>
            <span class="site-broker-link" style="font-size: 0.56rem; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; color: #8a8475; line-height: 1.25;">Four Seasons Sotheby's</span>
          </span>
        </a>
      </div>
      <div class="site-menu" style="display: flex; align-items: center; gap: 30px; flex-wrap: wrap;">
        <a href="about.html" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">About</a>
        <a href="about.html" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">Approach</a>
        <a href="index.html#communities" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">Communities</a>
        <a href="preparing-your-home.html" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">Sell</a>
        <a class="site-menu-cta" href="index.html#contact" style="text-decoration: none; background: #173129; color: #f4ede1; padding: 13px 24px; border-radius: 2px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; transition: background .25s ease;" style-hover="background: #b08d57; color: #fffdf8;">Let's Talk</a>
      </div>
    </nav>
  </header>
</x-dc>
</body>
</html>
