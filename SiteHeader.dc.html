<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style data-mobile-header-polish>
  @media (max-width: 760px) {
    .site-header { position: sticky !important; top: 0 !important; }
    .site-nav {
      width: min(100% - 28px, 1240px) !important;
      min-height: auto !important;
      padding: 12px 0 14px !important;
      gap: 12px !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .site-brand {
      width: 100% !important;
      justify-content: center !important;
      align-items: center !important;
      padding-top: 4px !important;
    }
    .site-brand-main { gap: 10px !important; }
    .site-brand-main img { width: 38px !important; }
    .site-brand-name { font-size: 1rem !important; letter-spacing: 0.18em !important; }
    .site-broker-link { font-size: 0.54rem !important; letter-spacing: 0.22em !important; margin-top: 4px !important; }
    .site-menu {
      width: 100% !important;
      justify-content: center !important;
      gap: 8px 10px !important;
      flex-wrap: wrap !important;
    }
    .site-menu a {
      font-size: 0.66rem !important;
      letter-spacing: 0.07em !important;
      white-space: nowrap !important;
      line-height: 1 !important;
    }
    .site-menu a.site-menu-cta {
      padding: 10px 13px !important;
      min-height: 36px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
  }
  @media (max-width: 390px) {
    .site-nav { width: min(100% - 22px, 1240px) !important; padding-top: 10px !important; }
    .site-brand-main img { width: 34px !important; }
    .site-brand-name { font-size: 0.94rem !important; letter-spacing: 0.15em !important; }
    .site-broker-link { font-size: 0.5rem !important; letter-spacing: 0.18em !important; }
    .site-menu { gap: 7px 8px !important; }
    .site-menu a { font-size: 0.61rem !important; letter-spacing: 0.055em !important; }
    .site-menu a.site-menu-cta { padding: 9px 11px !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<header class="site-header" style="position: sticky; top: 0; z-index: 50; background: rgba(244,237,225,0.9); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(23,49,41,0.12); font-family: 'Mulish', system-ui, sans-serif;">
    <nav class="site-nav" style="width: min(1240px, calc(100% - 48px)); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; min-height: 84px;">
      <div class="site-brand" style="display: flex; align-items: center; gap: 13px; color: inherit;">
        <a class="site-brand-main" href="index.html" style="display: flex; align-items: center; gap: 13px; text-decoration: none; color: inherit;">
          <img src="logo-mark.png" alt="Skyler Davis Group" style="width: 46px; height: auto; display: block;">
          <span class="site-brand-name" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.18rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #173129; line-height: 1;">Skyler Davis</span>
        </a>
        <a class="site-broker-link" href="https://www.sothebysrealty.com/four" target="_blank" rel="noopener" style="font-size: 0.6rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #8a8475; text-decoration: none; line-height: 1;">Four Seasons Sotheby's</a>
      </div>
      <div class="site-menu" style="display: flex; align-items: center; gap: 30px; flex-wrap: wrap;">
        <a href="about.html" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">About</a>
        <a href="about.html" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">Approach</a>
        <a href="index.html#communities" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">Communities</a>
        <a href="preparing-your-home.html" style="text-decoration: none; color: #3a4039; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;" style-hover="color: #b08d57;">Sell</a>
        <a class="site-menu-cta" href="index.html#contact" style="text-decoration: none; background: #173129; color: #f4ede1; padding: 13px 24px; border-radius: 2px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; transition: background .25s ease;" style-hover="background: #b08d57; color: #fffdf8;">Let's Talk</a>
      </div>
    </nav>
  </header>
</x-dc>
</body>
</html>
